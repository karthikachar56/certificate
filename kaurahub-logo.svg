<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 205" width="100%" height="100%" class="kaurahub-svg-mark">
  <defs>
    <!-- Dynamic Color Tokens for Live Recoloring -->
    <linearGradient id="khAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--kh-accent-1, #00d2ff)" />
      <stop offset="100%" stop-color="var(--kh-accent-2, #0066ff)" />
    </linearGradient>

    <linearGradient id="khPillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--kh-pillar-1, #0a192f)" />
      <stop offset="100%" stop-color="var(--kh-pillar-2, #1e293b)" />
    </linearGradient>

    <linearGradient id="khTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--kh-text-1, #0f172a)" />
      <stop offset="100%" stop-color="var(--kh-text-2, #1e293b)" />
    </linearGradient>
  </defs>

  <g id="khEmblem" transform="translate(0, 5)">
    <!-- H - Pillar (White/Custom Pillar Gradient) -->
    <!-- Right Pillar of H -->
    <path d="M 178 54 L 204 54 L 204 126 C 204 133 198 138 191 138 L 189 138 C 182 138 178 133 178 126 Z" 
          fill="url(#khPillarGrad)" class="kh-pillar-elem" />

    <!-- Left Pillar & Crossbar of H -->
    <path d="M 134 76 L 156 76 C 160 76 163 79 163 83 L 163 126 C 163 133 158 138 151 138 L 144 138 C 138 138 134 133 134 126 Z" 
          fill="url(#khPillarGrad)" class="kh-pillar-elem" />
    <rect x="150" y="90" width="30" height="20" fill="url(#khPillarGrad)" class="kh-pillar-elem" />

    <!-- K - Vertical Stem -->
    <path d="M 88 44 C 82 44 78 48 78 54 L 78 126 C 78 134 83 138 90 138 L 102 138 C 106 138 108 135 108 130 L 108 50 C 108 46 105 44 100 44 Z" 
          fill="url(#khAccentGrad)" class="kh-accent-elem" />

    <!-- K - Upper Diagonal Branch -->
    <path d="M 104 88 L 146 48 C 151 43 157 44 161 48 L 165 52 C 169 57 169 63 164 68 L 124 106 Z" 
          fill="url(#khAccentGrad)" class="kh-accent-elem" />

    <!-- Dynamic Arch Swoosh connecting K into H with forward momentum -->
    <path d="M 85 138 C 96 122 118 106 148 94 C 178 82 208 72 232 50 C 228 62 210 78 184 92 C 154 108 126 120 98 140 Z" 
          fill="url(#khAccentGrad)" class="kh-accent-elem" />

    <!-- Graduation Cap / Mortarboard atop right pillar -->
    <!-- Cap Diamond Top -->
    <polygon points="191,14 222,27 191,40 160,27" fill="url(#khAccentGrad)" class="kh-accent-elem" />
    <!-- Cap Lower Band -->
    <path d="M 172 32 Q 191 40 210 32 L 210 38 Q 191 46 172 38 Z" fill="url(#khAccentGrad)" opacity="0.95" class="kh-accent-elem" />
    <!-- Cap Center Button -->
    <circle cx="191" cy="27" r="3" fill="url(#khPillarGrad)" class="kh-pillar-elem" />
    <!-- Tassel String and Pendant -->
    <path d="M 191 27 Q 218 31 220 44 L 220 52" fill="none" stroke="url(#khAccentGrad)" stroke-width="2" stroke-linecap="round" class="kh-accent-elem" />
    <polygon points="218,52 222,52 221,60 219,60" fill="url(#khAccentGrad)" class="kh-accent-elem" />
  </g>

  <!-- Typography: KAURAHUB -->
  <g id="khText" transform="translate(0, 182)">
    <text x="160" y="0" text-anchor="middle" font-family="'Montserrat', 'Outfit', 'Inter', sans-serif" font-size="28" font-weight="900" letter-spacing="4">
      <tspan fill="url(#khTextGrad)" class="kh-text-kaura">KAURA</tspan><tspan fill="url(#khAccentGrad)" class="kh-text-hub">HUB</tspan>
    </text>
  </g>
</svg>
